name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/rb_sim
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions libegl1 libgl1-mesa-dri
          rosdep update
          rosdep install --from-paths ws/src --ignore-src -y --rosdistro jazzy
      - name: Build
        shell: bash
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
      - name: Test
        shell: bash
        working-directory: ws
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          src/rb_sim/scripts/run_all_tests.sh
