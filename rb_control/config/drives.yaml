# Per-drive wiring read by rb_bringup sim.launch.py.
#   input_topic: TwistStamped topic of drive_controller, fed by cmd_vel_relay
#   controller_ros_args: remaps passed to the spawner as one string
#   relay: parameters of cmd_vel_relay
diff_2w:
  input_topic: /drive_controller/cmd_vel
  controller_ros_args: "-r /drive_controller/odom:=/odom"
  relay: {max_linear: 1.0, max_angular: 1.5}
skid_4w:
  input_topic: /drive_controller/cmd_vel
  controller_ros_args: "-r /drive_controller/odom:=/odom"
  relay: {max_linear: 1.0, max_angular: 1.5}
ackermann:
  input_topic: /drive_controller/reference
  controller_ros_args: "-r /drive_controller/odometry:=/odom -r /drive_controller/tf_odometry:=/tf"
  relay: {max_linear: 1.0, max_angular: 1.5, wheelbase: 0.40, max_steer: 0.45}
mecanum:
  input_topic: /drive_controller/reference
  controller_ros_args: "-r /drive_controller/odometry:=/odom -r /drive_controller/tf_odometry:=/tf"
  relay: {max_linear: 1.0, max_angular: 1.5}
