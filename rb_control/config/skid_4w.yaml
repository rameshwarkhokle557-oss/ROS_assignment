controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster: {type: joint_state_broadcaster/JointStateBroadcaster}
drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
    right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]
    # Makes commanded yaw match real yaw for this geometry. Re-measure if wheelbase or track changes.
    wheel_separation_multiplier: 1.34
    wheel_separation: 0.50
    wheel_radius: 0.12
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    tf_frame_prefix_enable: false
    open_loop: false
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 4.0
    angular.z.min_acceleration: -4.0
